name: Deploy Nginx Only

on:
  workflow_dispatch:

env:
  IMAGE_NAME: 'mcp-coop-platform'

jobs:
  deploy-nginx:
    name: Deploy Nginx Config to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image URI
        run: |
          IMAGE_URI_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_URI=$IMAGE_URI_LOWER" >> $GITHUB_ENV

      # 1. Copy Nginx template to the VM root
      - name: Copy Nginx Config via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MCP_COOP_ORG_VM_IP }}
          username: ${{ secrets.MCP_COOP_ORG_VM_USER }}
          key: ${{ secrets.MCP_COOP_ORG_VM_SSH_KEY }}
          source: "nginx.conf.template"
          target: "~/"

      # 2. Execute SSH commands to update and recreate nginx container
      - name: Restart Nginx via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          VPS_HOST: ${{ secrets.MCP_COOP_ORG_VM_IP }}
          CLOUDFLARE_SSL_CERT: ${{ secrets.MCP_COOP_ORG_CLOUDFLARE_SSL_CERT }}
          CLOUDFLARE_SSL_KEY: ${{ secrets.MCP_COOP_ORG_CLOUDFLARE_SSL_KEY }}

        with:
          host: ${{ secrets.MCP_COOP_ORG_VM_IP }}
          username: ${{ secrets.MCP_COOP_ORG_VM_USER }}
          key: ${{ secrets.MCP_COOP_ORG_VM_SSH_KEY }}
          envs: IMAGE_URI, VPS_HOST, CLOUDFLARE_SSL_CERT, CLOUDFLARE_SSL_KEY
          script: |
            set -e

            # Ensure the platform directory exists
            mkdir -p ~/mcp-coop-platform
            cd ~/mcp-coop-platform

            # --- ENV SETUP ---
            touch ~/.env
            sed -i '/^PORT=/d' ~/.env || true
            echo "PORT=80" >> ~/.env

            # --- SSL CERTIFICATES SETUP ---
            mkdir -p certs
            echo "$CLOUDFLARE_SSL_CERT" > certs/cert.pem
            echo "$CLOUDFLARE_SSL_KEY" > certs/key.pem
            chmod 600 certs/key.pem

            # Rename config for standard convenience
            mv ~/nginx.conf.template ./nginx.conf.template || true

            DOCKER_COMPOSE_CMD="docker compose"
            if ! docker compose version > /dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker-compose"
            fi

            # Recreate just the nginx container to apply new template and potentially new env vars
            IMAGE_URI=${IMAGE_URI} $DOCKER_COMPOSE_CMD --env-file ~/.env -p ${PLATFORM_CONTAINER_NAME:-mcp-coop-platform} up -d --force-recreate nginx
            
            # Reload nginx process inside just to be absolutely sure
            docker exec mcp-coop-nginx nginx -s reload || true
